        - heading "Denge Fisioterapia" [level=1] [ref=f34e46]
        - paragraph [ref=f34e47]: Un concepto de aplicación web para una clínica de fisioterapia que reúne el calendario de sesiones y el flujo de reservas de pacientes en un solo lugar.
        - generic [ref=f34e48]:
          - generic [ref=f34e49]:
            - term [ref=f34e50]: Cliente
            - definition [ref=f34e51]: Trabajo conceptual
          - generic [ref=f34e52]:
            - term [ref=f34e53]: Sector
            - definition [ref=f34e54]: Salud
          - generic [ref=f34e55]:
            - term [ref=f34e56]: Año
            - definition [ref=f34e57]: "2026"
          - generic [ref=f34e58]:
            - term [ref=f34e59]: Servicios
            - definition [ref=f34e60]: Aplicación web, Diseño UI/UX
      - img "Calendario semanal y pantalla móvil de reserva de la aplicación Denge" [ref=f34e64]
      - generic [ref=f34e66]:
        - blockquote [ref=f34e67]:
          - paragraph [ref=f34e68]: Este es un trabajo conceptual. La marca, los contenidos y las personas de la interfaz son ficticios. No se hizo para un cliente real.
        - heading "Problema" [level=2] [ref=f34e69]
        - paragraph [ref=f34e70]: Las clínicas suelen gestionar las citas entre llamadas, mensajes y una agenda en papel. Eso provoca sesiones solapadas, huecos vacíos y recordatorios tardíos. El equipo necesitaba ver la semana de un vistazo y los pacientes debían poder reservar con pocos toques.
        - heading "Enfoque" [level=2] [ref=f34e71]
        - paragraph [ref=f34e72]: En la parte de la clínica, el calendario semanal pasó a ser la pantalla principal. Los tipos de sesión se distinguen por color y por una etiqueta escrita a la vez, no solo por color, para que también los vean quienes tienen dificultad para distinguir colores.
        - paragraph [ref=f34e73]:
          - img "Calendario semanal de sesiones del equipo de la clínica" [ref=f34e74]
        - paragraph [ref=f34e75]: El panel de nueva cita permanece abierto junto al calendario. Las horas ocupadas aparecen tachadas y no se pueden elegir, lo que evita las citas dobles antes de que ocurran.
        - heading "Resultado" [level=2] [ref=f34e76]
        - paragraph [ref=f34e77]: "La parte del paciente es un flujo móvil de tres pasos: servicio, fecha y hora, y confirmación. Cada paso pide una sola decisión y la política de cambios se indica con claridad antes de confirmar. El concepto une la gestión de la clínica y la experiencia del paciente en un mismo sistema de diseño."
        - paragraph [ref=f34e78]:
          - img "Pantalla móvil donde el paciente elige la hora, junto al panel de nueva cita de la clínica" [ref=f34e79]
