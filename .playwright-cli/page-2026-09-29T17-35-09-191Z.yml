      - img "Kıyı Mimarlık konsept sitesinin masaüstü ve mobil ana sayfası" [ref=f38e64]
      - generic [ref=f38e66]:
        - blockquote [ref=f38e67]:
          - paragraph [ref=f38e68]: Bu bir konsept çalışmadır. Marka, içerikler ve arayüzdeki kişiler kurgusaldır. Gerçek bir müşteri için hazırlanmamıştır.
        - heading "Problem" [level=2] [ref=f38e69]
        - paragraph [ref=f38e70]: Mimarlık ofislerinin siteleri çoğu zaman ya ağır görsellerle yavaşlar ya da her projeyi aynı ızgaraya sıkıştırır. Yere özgü tasarlayan bir ofis için sitenin projeleri bir katalog gibi değil, her birinin hikâyesiyle anlatması gerekiyordu. Ziyaretçi, ofisin yaklaşımını ilk ekranda anlayabilmeliydi.
        - heading "Yaklaşım" [level=2] [ref=f38e71]
        - paragraph [ref=f38e72]: "Sayfanın dilini ofisin malzeme anlayışından türettik: kireç rengi bir zemin, zeytin yeşili tek bir vurgu ve büyük, sıkı aralıklı başlıklar. Proje listesi, görsellerle dolu bir ızgara yerine konum, tür ve durum bilgisini aynı satırda gösteren sade bir dizin olarak kurgulandı. Böylece sayfa hızlı açılıyor ve her proje kendi sayfasında büyük görsellerle anlatılabiliyor."
        - paragraph [ref=f38e73]:
          - img "Proje dizini ve yaklaşım bölümünün masaüstü görünümü" [ref=f38e74]
        - paragraph [ref=f38e75]: Ana görselde fotoğraf yerine yapının cephesini çizgi diliyle anlatan bir illüstrasyon kullanıldı. Bu seçim, gerçek proje fotoğrafları eklenene kadar sitenin eksik görünmesini de engelliyor.
        - heading "Sonuç" [level=2] [ref=f38e76]
        - paragraph [ref=f38e77]: Konsept; ana sayfa, proje dizini ve yaklaşım bölümünden oluşan, masaüstünde ve mobilde aynı sakinliği koruyan bir tasarım dili ortaya koyuyor. Mobilde proje dizini tek sütuna iner, başlık ve görsel sırası korunur.
        - paragraph [ref=f38e78]:
