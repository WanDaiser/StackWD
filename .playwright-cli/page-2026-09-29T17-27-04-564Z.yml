        - heading "Denge Physiotherapy" [level=1] [ref=f13e27]
        - paragraph [ref=f13e28]: A web application concept for a physiotherapy clinic that brings the session calendar and the client booking flow into one place.
        - generic [ref=f13e29]:
          - generic [ref=f13e30]:
            - term [ref=f13e31]: Client
            - definition [ref=f13e32]: Concept work
          - generic [ref=f13e33]:
            - term [ref=f13e34]: Sector
            - definition [ref=f13e35]: Healthcare
          - generic [ref=f13e36]:
            - term [ref=f13e37]: Year
            - definition [ref=f13e38]: "2026"
          - generic [ref=f13e39]:
            - term [ref=f13e40]: Services
            - definition [ref=f13e41]: Web application, UI/UX design
      - img "Weekly calendar and mobile booking screen of the Denge booking app" [ref=f13e45]
      - generic [ref=f13e47]:
        - blockquote [ref=f13e48]:
          - paragraph [ref=f13e49]: This is concept work. The brand, the content and the people shown in the interface are fictional. It was not made for a real client.
        - heading "Problem" [level=2] [ref=f13e50]
        - paragraph [ref=f13e51]: Clinics often manage bookings across phone calls, messages and a paper diary. That leads to double bookings, empty slots and late reminders. The team needed to see the week at a glance, and clients needed to book in a few taps.
        - heading "Approach" [level=2] [ref=f13e52]
        - paragraph [ref=f13e53]: On the clinic side, the weekly calendar became the main screen. Session types are distinguished by color and a written label together, not by color alone, so users who find colors hard to tell apart can still see the difference.
        - paragraph [ref=f13e54]:
          - img "Weekly session calendar of the clinic team" [ref=f13e55]
        - paragraph [ref=f13e56]: The new booking panel stays open next to the calendar. Taken slots are struck through and cannot be selected, which prevents double bookings before they happen.
        - heading "Outcome" [level=2] [ref=f13e57]
        - paragraph [ref=f13e58]: "The client side is a three-step mobile flow: service, date and time, confirmation. Each step asks for one decision, and the change policy is stated clearly before confirming. The concept joins clinic management and the client experience in one design system."
        - paragraph [ref=f13e59]:
          - img "Mobile screen where the client picks a time, next to the new booking panel of the clinic" [ref=f13e60]
