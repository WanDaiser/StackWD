      - img "Tane Kahve konsept mağazasının masaüstü ve mobil ana sayfası" [ref=f16e64]
      - generic [ref=f16e66]:
        - blockquote [ref=f16e67]:
          - paragraph [ref=f16e68]: Bu bir konsept çalışmadır. Marka, içerikler ve arayüzdeki kişiler kurgusaldır. Gerçek bir müşteri için hazırlanmamıştır.
        - heading "Problem" [level=2] [ref=f16e69]
        - paragraph [ref=f16e70]: Küçük kavurucuların online mağazaları genellikle hazır temalarla kurulur ve her kahveyi aynı ürün kartına indirger. Oysa nitelikli kahvede alıcıyı ikna eden şey menşe, rakım ve tat notlarıdır. Bu bilgiyi öne çıkaran, ama satın almayı zorlaştırmayan bir mağaza gerekiyordu.
        - heading "Yaklaşım" [level=2] [ref=f16e71]
        - paragraph [ref=f16e72]: Ana sayfanın merkezine haftanın kavrumunu koyduk. Menşe, rakım ve işleme bilgisi fiyatla aynı bakışta okunuyor. Ürün kartlarında tat notları ve kavrum derecesi küçük etiketlerle gösterildi, filtreler tek satırda tutuldu.
        - paragraph [ref=f16e73]:
          - img "Ürün listesi, filtreler ve ürün kartları" [ref=f16e74]
        - paragraph [ref=f16e75]: Renk paleti orman yeşili ve kehribar tonlarıyla kahvenin kendisini değil, geldiği coğrafyayı anlatıyor. Paket görselleri, gerçek ürün fotoğrafları gelene kadar mağazanın tutarlı görünmesini sağlayan çizimlerdir.
        - heading "Sonuç" [level=2] [ref=f16e76]
        - paragraph [ref=f16e77]: Mobilde kampanya bandı, sepet ve ana eylem ilk ekranda kalıyor. Ürün listesi tek sütunda, dokunmaya uygun büyüklükte ilerliyor. Konsept, ürün sayfası ve abonelik akışına genişletilebilecek bir bileşen seti sunuyor.
        - paragraph [ref=f16e78]:
          - 'img "Mağazanın mobilde üç ekranı: ana sayfa, ürün listesi ve ürün kartları" [ref=f16e79]'
