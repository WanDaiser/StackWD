        - heading "Tane Coffee" [level=1] [ref=f39e46]
        - paragraph [ref=f39e47]: An e-commerce concept for a specialty coffee roaster that joins the story of each coffee with the buying experience.
        - generic [ref=f39e48]:
          - generic [ref=f39e49]:
            - term [ref=f39e50]: Client
            - definition [ref=f39e51]: Concept work
          - generic [ref=f39e52]:
            - term [ref=f39e53]: Sector
            - definition [ref=f39e54]: Food and beverage
          - generic [ref=f39e55]:
            - term [ref=f39e56]: Year
            - definition [ref=f39e57]: "2026"
          - generic [ref=f39e58]:
            - term [ref=f39e59]: Services
            - definition [ref=f39e60]: E-commerce, UI/UX design
      - img "Desktop and mobile home page of the Tane Coffee concept store" [ref=f39e64]
      - generic [ref=f39e66]:
        - blockquote [ref=f39e67]:
          - paragraph [ref=f39e68]: This is concept work. The brand, the content and the people shown in the interface are fictional. It was not made for a real client.
        - heading "Problem" [level=2] [ref=f39e69]
        - paragraph [ref=f39e70]: Small roasters usually launch with off-the-shelf themes that reduce every coffee to the same product card. Yet what convinces a specialty coffee buyer is origin, altitude and tasting notes. The store needed to bring that information forward without making purchase any harder.
        - heading "Approach" [level=2] [ref=f39e71]
        - paragraph [ref=f39e72]: We put the roast of the week at the center of the home page. Origin, altitude and process read at the same glance as the price. Product cards show tasting notes and roast level as small tags, and filters stay on a single line.
        - paragraph [ref=f39e73]:
          - img "Product list, filters and product cards" [ref=f39e74]
        - paragraph [ref=f39e75]: The forest green and amber palette speaks about where the coffee comes from rather than the coffee itself. The bag drawings keep the store consistent until real product photography is ready.
        - heading "Outcome" [level=2] [ref=f39e76]
        - paragraph [ref=f39e77]: On mobile, the announcement bar, cart and main action stay on the first screen. The product list runs in a single column at a comfortable tap size. The concept provides a component set that can extend to product pages and a subscription flow.
        - paragraph [ref=f39e78]:
          - 'img "Three mobile screens of the store: home, product list and product cards" [ref=f39e79]'
